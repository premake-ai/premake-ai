<!doctype html>
<html lang="en">
<head>
  <script src="/apps/sdk.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Camera</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="home" class="screen" aria-label="Your cameras">
    <p id="summary" class="summary" role="status"></p>
    <div id="home-msg"></div>
    <div id="list" class="list"></div>
  </main>

  <main id="device" class="screen" hidden aria-label="Camera details">
    <div class="topnav">
      <button class="back" data-act="back" aria-label="Back to all cameras">
        <svg width="12" height="20" viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        All cameras
      </button>
    </div>
    <header id="d-head" class="head"></header>
    <section id="d-hero" class="card" aria-label="Connection"></section>
    <section id="d-photo" class="card" aria-label="Placement check"></section>
    <section class="card" aria-label="History">
      <div class="card-title-row"><h2>History</h2></div>
      <div id="d-range" class="seg" role="group" aria-label="Time range"></div>
      <div id="d-charts"></div>
    </section>
    <section id="d-profile" class="card" aria-label="Where it's mounted"></section>
    <section id="d-info" class="card" aria-label="About this camera"></section>
  </main>
</body>
</html>
